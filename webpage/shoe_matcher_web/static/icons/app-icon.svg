<!-- 双圆方案3: 垂直叠放版 -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深色背景 -->
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C2C2E;stop-opacity:1" />
    </linearGradient>
    
    <!-- 上圆渐变 -->
    <radialGradient id="topCircle" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF3B30;stop-opacity:1" />
    </radialGradient>
    
    <!-- 下圆渐变 -->
    <radialGradient id="bottomCircle" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#5856D6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AF52DE;stop-opacity:1" />
    </radialGradient>
    
    <!-- 阴影 -->
    <filter id="shadow3">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" 
        fill="url(#bg3)" filter="url(#shadow3)"/>
  
  <!-- 上圆 -->
  <circle cx="64" cy="48" r="22" fill="url(#topCircle)" filter="url(#shadow3)"/>
  
  <!-- 下圆 (部分重叠) -->
  <circle cx="64" cy="80" r="22" fill="url(#bottomCircle)" filter="url(#shadow3)"/>
  
  <!-- 重叠区域高光 -->
  <ellipse cx="64" cy="64" rx="16" ry="8" fill="rgba(255,255,255,0.15)"/>
  
  <!-- 标题 -->
  <text x="64" y="20" text-anchor="middle" font-family="SF Pro Display, Arial" 
        font-size="12" font-weight="600" fill="rgba(255,255,255,0.9)">Last</text>
  
  <!-- 底部标识 -->
  <text x="64" y="115" text-anchor="middle" font-family="SF Pro Display, Arial" 
        font-size="8" font-weight="400" fill="rgba(255,255,255,0.5)">MATCHING</text>
</svg>
