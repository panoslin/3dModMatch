<!-- 鞋模上传Modal -->
<div class="modal fade" id="shoeUploadModal" tabindex="-1" aria-labelledby="shoeUploadModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="shoeUploadModalLabel">
                    <i class="fas fa-upload me-2"></i>上传鞋模文件
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <!-- 文件上传区域 -->
                        <div class="upload-zone" id="shoe-upload-zone">
                            <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-3"></i>
                            <h6>拖拽多个文件到此处或点击选择</h6>
                            <p class="text-muted small">支持.3dm和.stl格式，最大100MB每个文件</p>
                            <input type="file" id="shoe-file-input" accept=".3dm,.stl" multiple style="display: none;">
                            <button type="button" class="btn btn-outline-primary" id="select-shoe-file">
                                选择多个文件
                            </button>
                        </div>
                        
                        <!-- 格式转换提示 -->
                        <div id="format-conversion-notice" class="alert alert-info d-none mt-3">
                            <i class="fas fa-info-circle me-2"></i>
                            <strong>自动转换：</strong>检测到STL文件，将自动转换为3DM格式后处理，转换过程可能需要一些时间。
                        </div>
                        
                        <!-- 文件信息 -->
                        <div id="shoe-file-info" class="mt-3 d-none">
                            <div class="card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h6 class="card-title mb-0">
                                            文件列表 
                                            <span class="badge bg-primary" id="file-count-badge">0</span>
                                        </h6>
                                    </div>
                                    
                                    <!-- 多文件列表 -->
                                    <div class="list-group list-group-flush" id="shoe-file-list">
                                        <!-- 文件列表将通过JavaScript动态填充 -->
                                    </div>
                                    
                                    <!-- 上传进度 -->
                                    <div class="mt-3" id="shoe-progress" style="display: none;">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <small class="text-muted">上传进度</small>
                                            <span class="badge bg-primary" id="shoe-upload-percentage">0%</span>
                                        </div>
                                        <div class="progress" style="height: 20px;">
                                            <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%; height: 100%;"></div>
                                        </div>
                                    </div>
                                    
                                    <!-- 单文件信息（向后兼容） -->
                                    <div id="single-file-info" class="d-none">
                                        <p class="card-text">
                                            <strong>文件名:</strong> <span id="shoe-filename">--</span><br>
                                            <strong>大小:</strong> <span id="shoe-filesize">--</span><br>
                                            <strong>状态:</strong> <span id="shoe-status" class="badge bg-secondary">准备中</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- <div class="col-md-6"> -->
                        <!-- 3D预览区域 -->
                        <!-- <div class="preview-container"> -->
                            <!-- <div id="shoe-preview-loading" class="preview-loading"> -->
                                <!-- <i class="fas fa-spinner fa-spin fa-2x text-muted"></i> -->
                                <!-- <p class="text-muted mt-2">正在生成预览...</p> -->
                            <!-- </div> -->
                            <!-- <div id="shoe-preview-content" style="display: none;"> -->
                                <!-- 3D预览将在这里显示 -->
                            <!-- </div> -->
                        <!-- </div> -->
                    <!-- </div> -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="confirm-shoe-upload" disabled>
                    <i class="fas fa-check me-2"></i>确认上传
                </button>
            </div>
        </div>
    </div>
</div>
